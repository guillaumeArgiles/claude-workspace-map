name: Release

# Triggered when a version tag is pushed: git tag v0.2.0 && git push --tags
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build & publish ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: ubuntu-latest
            platform: linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Build renderer + main process + preload
      - name: electron-vite build
        run: npm run build

      # Package and publish to GitHub Releases.
      # GH_TOKEN is automatically available in Actions — no manual secret needed.
      - name: Package & publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS notarisation credentials (wired in S7.4)
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "${{ matrix.platform }}" = "mac" ]; then
            npx electron-builder --mac --publish always
          else
            npx electron-builder --linux --publish always
          fi
