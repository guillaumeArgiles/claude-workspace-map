<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claude Workspace Map</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      html, body { margin: 0; padding: 0; background: var(--bg-primary, #0d1117); color: var(--text-primary, #eee); font-family: system-ui, -apple-system, sans-serif; height: 100%; overflow: hidden; }
      :root {
        --sidebar-w: 340px;
        --bg-primary: #0d1117;
        --bg-secondary: #111418;
        --bg-hover: #171d27;
        --bg-surface: #1a1f27;
        --border: #2c313a;
        --border-accent: #1a2744;
        --text-primary: #eeeeee;
        --text-muted: #9ca3af;
        --bg-header-start: #131c30;
      }
      #app-shell { display: flex; min-height: 100vh; height: 100vh; padding-right: var(--sidebar-w); box-sizing: border-box; }
      /* NB: transitions on properties that consume CSS variables don't animate
         reliably across browsers — keep the layout reflow instant and animate
         the sidebar's own width instead (see #agent-sidebar below). */
      #app-shell.sidebar-collapsed { --sidebar-w: 0px; }
      #game-mount { flex: 1 1 auto; min-width: 0; height: 100vh; overflow: hidden; image-rendering: pixelated; image-rendering: crisp-edges; }
      #game-mount canvas { display: block; }
      #agent-sidebar { position: fixed; top: 0; right: 0; width: var(--sidebar-w); height: 100vh; background: var(--bg-secondary, #111418); border-left: 1px solid var(--border, #2c313a); display: flex; flex-direction: column; transition: width 0.18s ease; z-index: 10; }
      #agent-sidebar.collapsed { width: 40px; align-items: center; padding: 10px 0; gap: 12px; }
      #agent-sidebar.collapsed .count-vert { font-size: 11px; opacity: 0.6; writing-mode: vertical-rl; transform: rotate(180deg); }
      #agent-sidebar header { display: flex; align-items: center; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border, #2c313a); }
      #agent-sidebar header h2 { font-size: 13px; font-weight: 600; margin: 0; letter-spacing: 0.04em; text-transform: uppercase; opacity: 0.85; flex: 1; }
      #agent-sidebar header .count { font-size: 11px; opacity: 0.6; }
      #agent-sidebar .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 6px currentColor; flex: 0 0 8px; }
      #agent-sidebar .dot.ok { background: #22c55e; }
      #agent-sidebar .dot.ko { background: #ef4444; }
      #agent-sidebar .collapse-btn { background: transparent; border: 1px solid var(--border, #2c313a); color: var(--text-primary, #eee); width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; }
      #agent-sidebar .collapse-btn:hover { background: #1e2430; }
      #agent-sidebar .groups { overflow-y: auto; flex: 1; padding: 4px 0 12px; }
      #agent-sidebar .empty { padding: 16px 14px; opacity: 0.55; font-size: 12px; }
      #agent-sidebar section.project { padding: 8px 0; border-bottom: 1px solid var(--bg-hover, #1d2128); }
      #agent-sidebar section.project h3 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.6; margin: 4px 14px 6px; font-weight: 700; }
      #agent-sidebar ul { list-style: none; margin: 0; padding: 0; }
      :where(#agent-sidebar, #cmd-palette) li.agent { padding: 2px 0 6px; list-style: none; }
      :where(#agent-sidebar, #cmd-palette) .agent-head { display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: 4px; cursor: pointer; outline: none; }
      :where(#agent-sidebar, #cmd-palette) .agent-head:hover { background: var(--bg-hover, #1c2128); }
      :where(#agent-sidebar, #cmd-palette) .agent-head:focus-visible { box-shadow: inset 0 0 0 1px #6366f1; }
      :where(#agent-sidebar, #cmd-palette) li.sub-agent { cursor: pointer; border-radius: 4px; outline: none; list-style: none; }
      :where(#agent-sidebar, #cmd-palette) li.sub-agent:hover { background: var(--bg-hover, #1c2128); }
      :where(#agent-sidebar, #cmd-palette) li.sub-agent:focus-visible { box-shadow: inset 0 0 0 1px #6366f1; }
      #agent-sidebar.errored .boundary-fallback { padding: 16px 14px; display: flex; flex-direction: column; gap: 10px; }
      #agent-sidebar.errored .boundary-fallback p { margin: 0; font-size: 13px; font-weight: 600; color: #f87171; }
      #agent-sidebar.errored .boundary-fallback code { font-size: 11px; opacity: 0.7; word-break: break-word; font-family: ui-monospace, monospace; }
      #agent-sidebar.errored .boundary-fallback button { width: max-content; background: #1f2937; border: 1px solid #374151; color: #eee; padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
      #agent-sidebar.errored .boundary-fallback button:hover { background: #2c3645; }
      :where(#agent-sidebar, #cmd-palette) .icon { flex: 0 0 32px; image-rendering: pixelated; background-repeat: no-repeat; }
      :where(#agent-sidebar, #cmd-palette) .meta { flex: 1; min-width: 0; }
      :where(#agent-sidebar, #cmd-palette) .name { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      :where(#agent-sidebar, #cmd-palette) .line { font-size: 11px; opacity: 0.85; display: flex; align-items: center; gap: 6px; margin-top: 2px; }
      :where(#agent-sidebar, #cmd-palette) .status-dot { width: 8px; height: 8px; border-radius: 50%; box-shadow: 0 0 5px currentColor; flex: 0 0 8px; }
      :where(#agent-sidebar, #cmd-palette) .tool { color: #f4f4f5; opacity: 0.85; }
      :where(#agent-sidebar, #cmd-palette) .detail { font-size: 10.5px; opacity: 0.55; margin-top: 4px; font-family: ui-monospace, monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-left: 42px; }
      :where(#agent-sidebar, #cmd-palette) ul.subs { margin: 6px 0 0 24px; padding-left: 14px; border-left: 1px dashed #2c313a; list-style: none; }
      :where(#agent-sidebar, #cmd-palette) li.sub-agent { display: flex; gap: 8px; padding: 4px 6px; }
      :where(#agent-sidebar, #cmd-palette) li.sub-agent .icon { flex: 0 0 24px; width: 24px; height: 24px; background-size: 72px 96px; background-position: -24px 0px; }
      :where(#agent-sidebar, #cmd-palette) li.sub-agent .detail { padding-left: 30px; }
      /* ── Spawn button in sidebar header ──────────────────────────────── */
      #agent-sidebar .spawn-btn-header { background: #1e2d3d; border: 1px solid #3b5a80; color: #7dd3fc; width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; transition: background 0.12s; }
      #agent-sidebar .spawn-btn-header:hover { background: #264a68; border-color: #60a5fa; }
      #agent-sidebar .empty { padding: 16px 14px; font-size: 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
      .empty-spawn-btn { background: #1e2d3d; border: 1px solid #3b5a80; color: #7dd3fc; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
      .empty-spawn-btn:hover { background: #264a68; }
      /* ── SpawnPanel modal ─────────────────────────────────────────────── */
      #spawn-panel-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 40; display: flex; align-items: center; justify-content: center; }
      #spawn-panel { background: var(--bg-secondary, #111418); border: 1px solid var(--border, #2c313a); border-radius: 8px; width: 420px; max-width: 92vw; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
      #spawn-panel header { display: flex; align-items: center; justify-content: space-between; margin: 0 0 4px; }
      #spawn-panel header h3 { margin: 0; font-size: 14px; font-weight: 700; }
      #spawn-panel label { font-size: 12px; opacity: 0.65; letter-spacing: 0.03em; text-transform: uppercase; }
      #spawn-panel input[type="text"] { background: var(--bg-primary, #0d1117); border: 1px solid var(--border, #2c313a); color: var(--text-primary, #eee); padding: 8px 10px; border-radius: 5px; font-size: 13px; font-family: ui-monospace, monospace; width: 100%; box-sizing: border-box; outline: none; }
      #spawn-panel input[type="text"]:focus { border-color: #6366f1; }
      #spawn-panel .recent-list { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      #spawn-panel .recent-label { font-size: 11px; opacity: 0.55; text-transform: uppercase; letter-spacing: 0.04em; margin-right: 4px; }
      #spawn-panel .recent-item { background: var(--bg-surface, #1a1f27); border: 1px solid var(--border, #2c313a); color: #ccc; padding: 3px 10px; border-radius: 12px; cursor: pointer; font-size: 12px; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #spawn-panel .recent-item:hover { border-color: #6366f1; color: #eee; }
      #spawn-panel .recent-item.active { border-color: #6366f1; background: #1e203a; color: #a5b4fc; }
      #spawn-panel .spawn-error { color: #f87171; font-size: 12px; margin: 0; }
      #spawn-panel .spawn-actions { display: flex; gap: 8px; justify-content: flex-end; }
      #spawn-panel .cancel-btn, #settings-panel .cancel-btn { background: transparent; border: 1px solid var(--border, #2c313a); color: #aaa; padding: 6px 14px; border-radius: 5px; cursor: pointer; font-size: 13px; }
      #spawn-panel .cancel-btn:hover, #settings-panel .cancel-btn:hover { border-color: #555; color: var(--text-primary, #eee); }
      #spawn-panel .spawn-btn, #settings-panel .spawn-btn { background: #4338ca; border: 1px solid #6366f1; color: #eee; padding: 6px 16px; border-radius: 5px; cursor: pointer; font-size: 13px; font-weight: 600; }
      #spawn-panel .spawn-btn:hover:not(:disabled), #settings-panel .spawn-btn:hover:not(:disabled) { background: #4f46e5; }
      #spawn-panel .spawn-btn:disabled, #settings-panel .spawn-btn:disabled { opacity: 0.45; cursor: not-allowed; }
      #spawn-panel .close-btn, #settings-panel .close-btn { background: transparent; border: none; color: #888; cursor: pointer; font-size: 14px; padding: 2px 4px; border-radius: 3px; line-height: 1; }
      #spawn-panel .close-btn:hover, #settings-panel .close-btn:hover { color: var(--text-primary, #eee); }
      /* ── TerminalOverlay — centered floating window in the map area ─── */
      #terminal-overlay { position: fixed; top: 0; left: 0; right: var(--sidebar-w); bottom: 0; z-index: 30; display: flex; align-items: center; justify-content: center; pointer-events: none; }
      #terminal-panel { pointer-events: all; display: flex; flex-direction: column; width: min(84vw, 960px); height: 68vh; background: var(--bg-primary, #0d1117); border: 1px solid #3b3f4a; border-radius: 10px; box-shadow: 0 24px 80px rgba(0,0,0,0.75), 0 0 0 1px rgba(255,255,255,0.04); overflow: hidden; }
      #terminal-header { display: flex; align-items: center; gap: 8px; padding: 9px 14px; background: var(--bg-secondary, #111418); border-bottom: 1px solid var(--bg-hover, #1d2128); flex: 0 0 auto; }
      #terminal-header .term-title { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      #terminal-header .term-pty-id { font-size: 10px; font-family: ui-monospace, monospace; opacity: 0.35; }
      #terminal-header .dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }
      #terminal-header .dot.ok { background: #22c55e; box-shadow: 0 0 6px #22c55e; }
      #terminal-header .dot.ko { background: #ef4444; }
      .term-controls { display: flex; gap: 4px; }
      .term-btn { background: transparent; border: 1px solid #2c313a; color: #888; cursor: pointer; width: 22px; height: 22px; border-radius: 4px; font-size: 13px; line-height: 1; padding: 0; display: flex; align-items: center; justify-content: center; }
      .term-btn:hover { background: #1e2430; color: #eee; border-color: #444; }
      .minimize-btn { font-size: 16px; padding-bottom: 3px; }
      /* xterm.js container */
      #terminal-xterm { flex: 1; overflow: hidden; padding: 6px; }
      #terminal-xterm .xterm { height: 100%; }
      #terminal-xterm .xterm-viewport { overflow-y: auto !important; }
      #terminal-xterm .xterm-screen { height: 100%; }
      /* ── Terminal badge in agent rows ─────────────────────────────────── */
      .terminal-badge { font-family: ui-monospace, monospace; font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 3px; flex-shrink: 0; letter-spacing: -0.02em; }
      .terminal-badge.active { background: rgba(99, 102, 241, 0.2); border: 1px solid #6366f1; color: #a5b4fc; }
      .terminal-badge.minimized { background: rgba(55, 65, 81, 0.4); border: 1px solid #374151; color: #6b7280; }
      /* ▶ hint shown on agents without a running terminal */
      .terminal-badge.resume-hint { background: transparent; border: 1px solid #2c313a; color: #4b5563; font-size: 8px; opacity: 0; transition: opacity 0.12s; }
      :where(#agent-sidebar, #cmd-palette) .agent-head:hover .resume-hint { opacity: 1; }
      /* ··· spinner shown while launching */
      .terminal-badge.resuming-badge { background: rgba(251,191,36,0.15); border: 1px solid #d97706; color: #fbbf24; letter-spacing: 0.1em; animation: badge-pulse 0.9s ease-in-out infinite; }
      @keyframes badge-pulse { 0%,100% { opacity:1 } 50% { opacity:0.4 } }
      :where(#agent-sidebar, #cmd-palette) .agent-head.resuming { cursor: wait; opacity: 0.75; }
      /* ── Terminal crash / ended bars ─────────────────────────────────────── */
      #terminal-crash-bar, #terminal-ended-bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 14px; flex: 0 0 auto; font-size: 12px; }
      #terminal-crash-bar { background: rgba(239,68,68,0.12); border-top: 1px solid rgba(239,68,68,0.35); }
      #terminal-ended-bar { background: rgba(30,36,48,0.9); border-top: 1px solid #2c313a; color: #9ca3af; }
      .crash-msg { color: #fca5a5; }
      .crash-detail { opacity: 0.65; font-family: ui-monospace, monospace; font-size: 10.5px; }
      .crash-respawn-btn { background: #1e2d3d; border: 1px solid #3b5a80; color: #7dd3fc; padding: 4px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
      .crash-respawn-btn:hover { background: #264a68; border-color: #60a5fa; }
      /* ── Notifications ────────────────────────────────────────────────────── */
      .notif-btn { background: transparent; border: 1px solid var(--border, #2c313a); color: var(--text-primary, #eee); width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; opacity: 0.6; transition: opacity 0.12s, background 0.12s, border-color 0.12s; }
      .notif-btn:hover { opacity: 1; background: #1e2430; }
      .notif-btn.active { background: #2d2210; border-color: #a16207; color: #fbbf24; opacity: 1; }
      .notif-btn.active:hover { background: #3d2e10; border-color: #d97706; }
      .notif-btn[title*="bloquées"] { cursor: not-allowed; opacity: 0.35; }
      /* Pulsing status dot for awaiting_approval / blocked */
      @keyframes dot-pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.45; transform: scale(1.35); } }
      .status-dot-pulse { animation: dot-pulse 1.5s ease-in-out infinite; }
      /* ── Pending approval / question widget ──────────────────────────────── */
      .approval-widget { margin: 2px 10px 6px 10px; padding: 10px 12px; background: rgba(99,102,241,0.07); border: 1px solid rgba(99,102,241,0.25); border-radius: 6px; display: flex; flex-direction: column; gap: 7px; }
      .approval-header { display: flex; align-items: flex-start; gap: 7px; }
      .approval-icon { font-size: 14px; flex: 0 0 auto; line-height: 1.4; }
      .approval-title { font-size: 12px; font-weight: 600; color: #c7d2fe; line-height: 1.35; }
      .approval-preview { margin: 0; font-size: 11px; color: #9ca3af; line-height: 1.45; font-style: italic; }
      .approval-options { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
      .approval-option { display: flex; gap: 6px; font-size: 11.5px; color: #d1d5db; align-items: baseline; }
      .option-num { color: #818cf8; font-weight: 700; flex: 0 0 auto; min-width: 14px; }
      .option-label { font-weight: 500; }
      .option-desc { color: #6b7280; font-size: 10.5px; margin-left: 4px; }
      .approval-more { margin: 0; font-size: 10.5px; color: #6b7280; font-style: italic; }
      .approval-actions { display: flex; gap: 6px; flex-wrap: wrap; }
      .approval-btn { background: rgba(99,102,241,0.15); border: 1px solid rgba(99,102,241,0.4); color: #a5b4fc; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 11.5px; font-weight: 600; transition: background 0.12s, border-color 0.12s; white-space: nowrap; }
      .approval-btn:hover { background: rgba(99,102,241,0.28); border-color: #818cf8; color: #e0e7ff; }
      .approval-external-hint { font-size: 11px; color: #6b7280; font-style: italic; }
      /* ── Dismiss / clear buttons ─────────────────────────────────────────── */
      .dismiss-btn { opacity: 0; background: transparent; border: none; color: #6b7280; cursor: pointer; padding: 2px 5px; border-radius: 3px; font-size: 15px; line-height: 1; transition: opacity 0.1s, color 0.1s; flex-shrink: 0; }
      :where(#agent-sidebar, #cmd-palette) .agent-head:hover .dismiss-btn { opacity: 1; }
      .dismiss-btn:hover { color: #ef4444; }
      #agent-sidebar .clear-btn-header { background: transparent; border: 1px solid #2c313a; color: #eee; width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; opacity: 0.6; transition: opacity 0.12s, background 0.12s; }
      #agent-sidebar .clear-btn-header:hover { opacity: 1; background: #1e2430; }
      #agent-sidebar .professor-btn-header { background: #1e2d1e; border: 1px solid #3b6b3b; color: #86efac; width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; transition: background 0.12s; }
      #agent-sidebar .professor-btn-header:hover { background: #264a26; border-color: #4ade80; }
      /* ── C3 — Ambiance RPG ────────────────────────────────────────────── */
      html, body { background: #0d1117; }
      #game-mount { position: relative; }
      #game-mount::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 48%, transparent 52%, rgba(0,0,0,0.55) 100%); pointer-events: none; z-index: 5; }
      #agent-sidebar { border-left: 1px solid var(--border-accent, #1a2744); box-shadow: -8px 0 28px rgba(0,0,0,0.55); }
      #agent-sidebar header { background: linear-gradient(160deg, var(--bg-header-start, #131c30) 0%, var(--bg-secondary, #111418) 100%); border-bottom: 1px solid var(--border-accent, #1a2744); }
      #agent-sidebar .groups::-webkit-scrollbar { width: 3px; }
      #agent-sidebar .groups::-webkit-scrollbar-track { background: transparent; }
      #agent-sidebar .groups::-webkit-scrollbar-thumb { background: #2a3345; border-radius: 2px; }
      #agent-sidebar .groups::-webkit-scrollbar-thumb:hover { background: #3d4f6a; }
      :where(#agent-sidebar, #cmd-palette) .status-dot { transition: background-color 0.35s ease, box-shadow 0.35s ease; }
      :where(#agent-sidebar, #cmd-palette) .agent-head:hover { background: var(--bg-hover, #171d27); box-shadow: inset 2px 0 0 #6366f1; }
      /* ── SettingsPanel modal ──────────────────────────────────────────── */
      #settings-panel-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 40; display: flex; align-items: center; justify-content: center; }
      #settings-panel { background: var(--bg-secondary, #111418); border: 1px solid var(--border, #2c313a); border-radius: 8px; width: 380px; max-width: 92vw; padding: 20px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 12px 40px rgba(0,0,0,0.6); }
      #settings-panel header { display: flex; align-items: center; justify-content: space-between; margin: 0 0 4px; }
      #settings-panel header h3 { margin: 0; font-size: 14px; font-weight: 700; color: var(--text-primary, #eee); }
      #settings-panel .settings-label { font-size: 12px; opacity: 0.65; letter-spacing: 0.03em; text-transform: uppercase; color: var(--text-primary, #eee); }
      .settings-toggle { display: flex; gap: 6px; }
      .settings-toggle button { background: var(--bg-surface, #1a1f27); border: 1px solid var(--border, #2c313a); color: var(--text-primary, #eee); padding: 5px 16px; border-radius: 4px; cursor: pointer; font-size: 13px; transition: border-color 0.12s, background 0.12s; }
      .settings-toggle button.active { border-color: #6366f1; background: #1e203a; color: #a5b4fc; }
      .settings-toggle button:not(.active):hover { border-color: #555; }
      .settings-slider-row { display: flex; align-items: center; gap: 10px; }
      .settings-slider-row input[type="range"] { flex: 1; accent-color: #6366f1; }
      .settings-slider-val { font-size: 12px; font-family: ui-monospace, monospace; opacity: 0.7; min-width: 40px; text-align: right; color: var(--text-primary, #eee); }
      .settings-port { font-family: ui-monospace, monospace; font-size: 13px; color: var(--text-primary, #eee); opacity: 0.8; }
      .settings-note { font-size: 11px; opacity: 0.5; font-style: italic; margin-left: 6px; }
      .settings-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
      #agent-sidebar .settings-btn-header { background: transparent; border: 1px solid var(--border, #2c313a); color: var(--text-primary, #eee); width: 22px; height: 22px; border-radius: 4px; cursor: pointer; font-size: 12px; line-height: 1; padding: 0; opacity: 0.6; transition: opacity 0.12s, background 0.12s; }
      #agent-sidebar .settings-btn-header:hover { opacity: 1; background: var(--bg-hover, #1e2430); }
      /* ── StatsDashboard modal ────────────────────────────────────────────── */
      #stats-dashboard-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 40; display: flex; align-items: center; justify-content: center; padding: 4vh 4vw; }
      #stats-dashboard { background: var(--bg-secondary, #111418); border: 1px solid var(--border, #2c313a); border-radius: 10px; width: 100%; max-width: 1200px; height: 92vh; padding: 20px 24px; display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.7); overflow: hidden; }
      #stats-dashboard header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
      #stats-dashboard header h3 { margin: 0; font-size: 15px; font-weight: 700; color: var(--text-primary, #eee); }
      #stats-dashboard .stats-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
