appId: dev.claudeworkspace.map
productName: Claude Workspace Map
copyright: Copyright © 2026

directories:
  output: release

# Files shipped inside the ASAR archive:
# - compiled renderer bundle
# - compiled main-process + preload bundles
# - production node_modules (chokidar, pino, pino-pretty, zod, electron-updater…)
#   → electron-builder auto-includes everything listed in `dependencies`
files:
  - dist/**
  - dist-electron/**
  - package.json

# GitHub Releases — used by electron-updater to fetch update manifests
# Replace <owner> and <repo> before the first release tag push
publish:
  provider: github
  owner: <owner>
  repo: claude-workspace-map

# macOS (notarisation deferred to S7.4 — needs Apple Developer ID)
mac:
  identity: null
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.developer-tools
  # icon: build/icon.icns  ← added in S3.3

# Linux
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development
  # icon: build/icon.png  ← added in S3.3
